version: "3.9"

services:
  db_test:
    image: postgres:15
    container_name: api_mp_test_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: api_mp_test
    ports:
      - "5433:5432"
    volumes:
      - db_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 5s
      retries: 5

volumes:
  db_test_data:
